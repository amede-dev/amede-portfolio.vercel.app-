<!-- CONTACT -->
    <section id="contact" class="reveal">

        <div class="section-header">
            <h2>Me <span style="color:var(--accent)">Contacter</span></h2>
            <p class="contact-subtitle">N'hésitez pas à me contacter pour toute opportunité ou collaboration</p>
        </div>

        <div class="contact-layout">

            <div class="contact-info">
                <h3>Informations de contact</h3>

                <div class="contact-info-item">
                    <span class="contact-svg-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    </span>
                    <div>
                        <p class="info-label">Email</p>
                        <p class="info-value">rakotonandrasanaamede5@gmail.com</p>
                    </div>
                </div>

                <div class="contact-info-item">
                    <span class="contact-svg-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    </span>
                    <div>
                        <p class="info-label">Téléphone</p>
                        <p class="info-value">+261 38 209 9195</p>
                    </div>
                </div>

                <div class="contact-info-item">
                    <span class="contact-svg-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    </span>
                    <div>
                        <p class="info-label">Localisation</p>
                        <p class="info-value">Fianarantsoa, Madagascar</p>
                    </div>
                </div>
            </div>

            <div class="contact-form-box">
                <div class="form-group">
                    <input type="text" id="formNom" class="form-input" placeholder="Nom" />
                </div>
                <div class="form-group">
                    <input type="email" id="formEmail" class="form-input" placeholder="Email" />
                </div>
                <div class="form-group">
                    <input type="tel" id="formTelephone" class="form-input" placeholder="Téléphone" />
                </div>
                <div class="form-group">
                    <textarea id="formMessage" class="form-input form-textarea" placeholder="Message"></textarea>
                </div>
                <button class="btn-send">Envoyer</button>
            </div>

        </div>

    </section>
